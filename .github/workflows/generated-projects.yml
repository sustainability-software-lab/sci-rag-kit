# Does a project the wizard generates actually work?
#
# The unit tests assert that no manager's commands leak into another manager's
# project. They cannot assert that the resulting project installs and runs,
# because that needs the real manager on a real runner. This workflow does.
#
# uv runs on every pull request, because it is the manager the template itself
# uses and its leg is fast. pixi and conda pull large environments over the
# network, so the full four-way matrix runs nightly and on release tags. An
# untested manager option is worse than no option, so a manager that is not
# green here should not be advertised in the documentation.
name: generated-projects

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which managers this run covers. Everything except a pull request gets all
  # four. A pull request gets uv only, unless it touches the code that decides
  # what a generated project looks like, in which case it gets all four too:
  # those are exactly the changes a uv-only leg cannot catch.
  select:
    runs-on: ubuntu-latest
    outputs:
      managers: ${{ steps.pick.outputs.managers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          ALL='["uv","pixi","conda","venv+pip"]'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "managers=$ALL" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/sci_rag/scaffold/|\.github/workflows/generated-projects\.yml|Dockerfile|\.devcontainer/|Makefile)'; then
            echo "the diff changes what a generated project looks like; running all four"
            echo "managers=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo 'managers=["uv"]' >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        manager: ${{ fromJSON(needs.select.outputs.managers) }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sci_rag
          POSTGRES_USER: sci_rag
          POSTGRES_PASSWORD: sci_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sci_rag -d sci_rag"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # The generated project runs fully offline: the deterministic local
      # embedder, no credentials, no model calls.
      SCI_RAG_EMBEDDING_PROVIDER: local-hash
      SCI_RAG_EMBEDDING_DIM: "1536"
      SCI_RAG_DATABASE_URL: postgresql+asyncpg://sci_rag:sci_rag@localhost:5433/sci_rag
    steps:
      - uses: actions/checkout@v7

      # The generator itself always runs under the template's own toolchain.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Generate a project for ${{ matrix.manager }}
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/generated"
          cat > "$RUNNER_TEMP/answers.yaml" <<EOF
          project_name: Generated KB
          repo_name: generated-kb
          description: A project generated by the sci-rag wizard in CI.
          author_name: sci-rag-kit CI
          contact_email: ""
          python_version: "3.12"
          environment_manager: ${{ matrix.manager }}
          credentials: offline
          ontology: keep_demo_example
          corpus_source: demo_only
          include_terraform: "No"
          include_demo_corpus: "Yes"
          open_source_license: BSD-3-Clause
          initialize_git: "No"
          EOF
          uv run sci-rag init --answers-file "$RUNNER_TEMP/answers.yaml" \
            --target "$RUNNER_TEMP/generated"

      - name: The generated build surfaces agree with the chosen manager
        run: |
          cd "$RUNNER_TEMP/generated"
          # The install command this job runs below has to be the one the
          # generated project tells its users to run. Read it, do not assume it.
          SYNC=$(sed -n '/^setup:/,/^$/p' Makefile | sed -n '2p' | sed 's/^\t//')
          echo "generated setup command: $SYNC"
          echo "SYNC=$SYNC" >> "$GITHUB_ENV"
          for other in "uv run" "pixi run" "conda run" "astral-sh/setup-uv" \
                       "prefix-dev/setup-pixi" "conda-incubator/setup-miniconda"; do
            case "${{ matrix.manager }}:$other" in
              uv:"uv run"|uv:"astral-sh/setup-uv") continue ;;
              pixi:"pixi run"|pixi:"prefix-dev/setup-pixi") continue ;;
              conda:"conda run"|conda:"conda-incubator/setup-miniconda") continue ;;
            esac
            if grep -rqF -- "$other" Makefile Dockerfile .github/workflows README.md docs; then
              echo "::error::a ${{ matrix.manager }} project still mentions '$other'"
              grep -rnF -- "$other" Makefile Dockerfile .github/workflows README.md docs | head -20
              exit 1
            fi
          done

      - name: Install pixi
        if: matrix.manager == 'pixi'
        uses: prefix-dev/setup-pixi@v0
        with:
          manifest-path: ${{ runner.temp }}/generated/pyproject.toml
          cache: false

      - uses: conda-incubator/setup-miniconda@v3
        if: matrix.manager == 'conda'
        with:
          auto-activate-base: true
          activate-environment: ""

      - name: Install the generated project and run its own checks
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          case "${{ matrix.manager }}" in
            uv)       eval "$SYNC"; RUN="uv run" ;;
            pixi)     eval "$SYNC"; RUN="pixi run" ;;
            conda)    eval "$SYNC"; RUN="conda run -n generated-kb" ;;
            # An activated venv has no prefix; putting its bin directory on PATH
            # is how a user would work in it, and it keeps one code path here.
            venv+pip) eval "$SYNC"; echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; RUN="" ;;
          esac
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          $RUN ruff check src tests examples scripts
          $RUN mypy

      - name: The offline demo runs in the generated project
        shell: bash -el {0}
        run: |
          cd "$RUNNER_TEMP/generated"
          $RUN sci-rag db upgrade
          $RUN sci-rag ingest --manifest data/demo/manifest.jsonl
          $RUN sci-rag retrieve "How much rice straw was generated in the Colusa Basin in 2023?" --profile interactive --limit 3
          $RUN sci-rag eval retrieval

      # Diagnostic, not a gate. `doctor` reports FAIL when an LLM model is
      # configured with no credentials behind it, which is exactly the state an
      # offline project is in on purpose. The demo above is the assertion.
      - name: sci-rag doctor (diagnostic)
        if: always()
        continue-on-error: true
        shell: bash -el {0}
        run: cd "$RUNNER_TEMP/generated" && $RUN sci-rag doctor
