[project]
name = "sci-rag-kit"
version = "0.1.0a0"
description = "A DIY GraphRAG factory for scientific domains: ingest your literature, build a knowledge graph in Postgres, retrieve with five fused layers, evaluate honestly, and serve over REST and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
keywords = ["rag", "graphrag", "retrieval", "pgvector", "scientific-software", "llm", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "alembic>=1.13",
  "pgvector>=0.3.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "httpx>=0.27",
  "google-genai>=2.0",
  "google-auth>=2.29",
  "pypdf>=4.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "mcp>=2.1",
]

[project.optional-dependencies]
# Docling gives the best PDF parsing (real table extraction), but pulls in a
# large ML stack. The kit falls back to pypdf when docling is not installed.
docling = ["docling>=2.15"]
# Exact token counting. Without it the kit uses a fast, offline approximation.
tokenizers = ["tiktoken>=0.7"]

[project.scripts]
sci-rag = "sci_rag.cli.main:app"

[project.urls]
Homepage = "https://github.com/sustainability-software-lab/sci-rag-kit"
Documentation = "https://github.com/sustainability-software-lab/sci-rag-kit/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# typer's Argument/Option in defaults is the canonical typer idiom.
extend-immutable-calls = [
  "typer.Argument",
  "typer.Option",
  # require_scopes returns a fastapi.Depends; calling it in a default is the point.
  "sci_rag.server.auth.require_scopes",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length is enforced by the formatter
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["sci_rag"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# asyncpg pools bind to one event loop, so all tests share a session loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs a running Postgres (see docker-compose.yml)",
  "cloud: needs Google credentials; skipped by default in CI",
]

[tool.coverage.run]
source = ["src/sci_rag"]
